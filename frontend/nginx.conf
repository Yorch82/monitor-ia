# Log de seguridad: lo consume el backend para detectar escaneos web.
# Formato fijo parseado por app/security/parsers.py (_NGINX_LINE).
log_format security '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    access_log /var/log/nginx/security.log security;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API REST + CSV
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy OpenAI-compatible (el cliente de IA puede apuntar al puerto del frontend)
    location /proxy/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;          # wichtig para streaming SSE
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # WebSocket de telemetría
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
