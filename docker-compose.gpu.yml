# Overlay para acceder a la GPU NVIDIA real desde el backend.
# Arranque: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# (requiere Docker Desktop/Engine con soporte GPU y driver NVIDIA en el anfitrión)
services:
  backend:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility,compute
