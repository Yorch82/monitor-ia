name: MonitorIA
options:
  bundleIdPrefix: com.yorch
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MonitorIA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonitorIA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yorch.monitoria
        PRODUCT_NAME: MonitorIA
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

schemes:
  MonitorIA:
    build:
      targets:
        MonitorIA: all
    run:
      config: Debug
    archive:
      config: Release
